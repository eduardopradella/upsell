<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oferta Exclusiva de Upsell - O Truque da Colher Japonesa">
    <title>Oferta Exclusiva - O Truque da Colher Japonesa</title>
    
    <!-- Pré-conexão para fontes para acelerar o carregamento mobile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIÁVEIS DE DESIGN & CONFIGURAÇÕES RÁPIDAS DE EDALÇAS/CORES
           ========================================================================== */
        :root {
            /* Cores de Fundo (Modo Escuro / Black Premium) */
            --bg-body: #050505;
            --bg-card: #0d0d0e;
            --bg-card-secondary: #141416;
            --border-color: #222226;
            --border-highlight: #33333b;

            /* Tipografia */
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Textos Base */
            --text-primary: #ffffff;
            --text-secondary: #c4c4cc;
            --text-muted: #8e8e93;

            /* Destaques Strategicos de Direct Response (Neon & Marca-Texto) */
            --accent-green: #00ff66;
            --accent-green-hover: #00cc52;
            --accent-green-glow: rgba(0, 255, 102, 0.25);
            
            /* Cores de Marca-Texto (Highlight Boxes) */
            --highlight-yellow-bg: rgba(255, 214, 10, 0.18);
            --highlight-yellow-text: #ffd60a;
            --highlight-purple-bg: rgba(191, 90, 242, 0.2);
            --highlight-purple-text: #e5b8ff;
            --highlight-green-bg: rgba(0, 255, 102, 0.15);
            --highlight-green-text: #00ff66;

            /* Urgência & Alertas */
            --alert-bg: rgba(255, 69, 58, 0.12);
            --alert-border: #ff453a;
            --alert-text: #ff6961;

            /* Dimensões Otimizadas para Mobile */
            --container-width: 680px;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        /* CONFIGURAÇÃO RÁPIDA DE IMAGENS / PASTA FUTURA (MANTIDA) */
        /* Para usar suas próprias imagens, basta salvá-las na pasta /assets/img/ */

        /* ==========================================================================
           2. RESET & BASE TIPOGRÁFICA MOBILE-FIRST
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            /* Tamanho de fonte 18px base para perfeita legibilidade no telemóvel */
            font-size: 1.125rem; 
            line-height: 1.65;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 12px 14px 40px 14px;
        }

        .container {
            max-width: var(--container-width);
            margin: 0 auto;
        }

        /* ==========================================================================
           3. ESTILOS DE DESTAQUES & MARCA-TEXTO (COPYWRITING HIGH-CONVERSION)
           ========================================================================== */
        
        /* Marca-Texto Amarelo Ouro */
        .hl-yellow {
            background-color: var(--highlight-yellow-bg);
            color: var(--highlight-yellow-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            display: inline-block;
            line-height: 1.3;
        }

        /* Marca-Texto Roxo/Lilás Sophisticated */
        .hl-purple {
            background-color: var(--highlight-purple-bg);
            color: var(--highlight-purple-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            display: inline-block;
            line-height: 1.3;
        }

        /* Marca-Texto Verde Vendas/Resultados */
        .hl-green {
            background-color: var(--highlight-green-bg);
            color: var(--highlight-green-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            display: inline-block;
            line-height: 1.3;
        }

        /* Palavras de Alto Impacto em Caixa Alta e Verde Neon */
        .power-word {
            color: var(--accent-green);
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .power-word-yellow {
            color: var(--highlight-yellow-text);
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        /* ==========================================================================
           4. COMPONENTES VISUAIS & ESTRUTURA
           ========================================================================== */

        /* Barra de Alerta de Topo */
        .top-alert {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            color: var(--alert-text);
            text-align: center;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(255, 69, 58, 0.15);
        }

        /* Seção da Headline */
        .headline-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .main-headline {
            font-size: 1.625rem; /* Otimizado para telas pequenas */
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .sub-headline {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.5;
            margin-top: 12px;
        }

        /* Containers de Mídia (Espaços Estratégicos para Fotos/Vídeos) */
        .media-placeholder {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-secondary) 100%);
            border: 2px dashed var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 24px 16px;
            text-align: center;
            margin: 28px 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .media-placeholder.featured {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.12);
        }

        .media-placeholder img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            display: block;
            margin: 0 auto;
        }

        .media-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .media-title {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Blocos do Roteiro TSL */
        .tsl-block {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            margin-bottom: 24px;
        }

        .tsl-block p {
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        .tsl-block p:last-child {
            margin-bottom: 0;
        }

        .tsl-block strong {
            color: var(--text-primary);
        }

        /* Lista de Benefícios de Alta Conversão */
        .benefit-card-list {
            list-style: none;
            margin: 24px 0;
        }

        .benefit-card-list li {
            background-color: var(--bg-card-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            font-size: 1.0625rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .benefit-icon {
            color: var(--accent-green);
            font-size: 1.25rem;
            line-height: 1;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Card de Preço & Oferta Irresistível */
        .pricing-section {
            background: linear-gradient(180deg, var(--bg-card-secondary) 0%, var(--bg-card) 100%);
            border: 2px solid var(--accent-green);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            text-align: center;
            margin: 32px 0 24px 0;
            position: relative;
            box-shadow: 0 0 30px var(--accent-green-glow);
        }

        .pricing-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-green);
            color: #000000;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .price-old {
            font-size: 1.125rem;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .price-main {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .price-main span {
            color: var(--accent-green);
        }

        .price-subtext {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ==========================================================================
           5. BOTÕES DE AÇÃO (CTA PRINCIPAL COM ANIMAÇÃO E LINK DE RECUSA)
           ========================================================================== */
        .cta-container {
            text-align: center;
            margin: 28px 0;
        }

        .btn-cta-main {
            display: block;
            width: 100%;
            background-color: var(--accent-green);
            color: #000000;
            font-size: 1.25rem;
            font-weight: 900;
            text-decoration: none;
            padding: 22px 18px;
            border-radius: var(--radius-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--accent-green-glow);
            transition: transform 0.2s ease, background-color 0.2s ease;
            
            /* Animação Pulsante para Capturar Atenção */
            animation: pulse-glow 2s infinite;
        }
